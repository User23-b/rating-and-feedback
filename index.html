<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation System</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Evaluation Form</h2>
    <p>Please rate the following questions:</p>

    <form id="evaluationForm">

        <div class="question">
            1. How would you rate the overall presentation?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="question">
            2. Was the explanation easy to understand?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="question">
            3. Was the information useful?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="question">
            4. Was the presenter prepared?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="question">
            5. Overall, how satisfied are you?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <button type="submit">Submit Evaluation</button>
    </form>
</div>

<!-- Toast Notification Element -->
<div id="toast" class="toast">Thank you! Your evaluation has been submitted.</div>

<!-- Link to external JavaScript file -->
<script src="script.js"></script>

</body>
</html>
