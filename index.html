<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation System</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Evaluation Form</h2>
    <p>Please rate the following questions:</p>

    <form id="evaluationForm">

        <div class="question">
            1. How would you rate the overall Activity?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="question">
            2. Was the explanation easy to understand?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="question">
            3. Was the information useful?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="question">
            4.  Nurse/Doctor Rating ?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <div class="question">
            5. Overall, how satisfied are you?
            <select required>
                <option value="">Select rating</option>
                <option>Excellent</option>
                <option>Good</option>
                <option>Fair</option>
                <option>Poor</option>
            </select>
        </div>

        <button type="submit">Submit Evaluation</button>
    </form>

    <p id="result"></p>
     <div id="qr">
        <h3>Scan QR Code</h3>
        <p>QR code for this evaluation page:</p>
        <img id="qrImage" alt="QR Code" width="180">
    </div>
</div>

<!-- Link to external JavaScript file -->
<script src="script.js"></script>

</body>
</html>
